name: Upstream watch

on:
  schedule:
  - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upstream-watch:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: main

    - name: Add remotes
      run: |
        git remote add upstream https://github.com/pypsa-meets-earth/pypsa-earth.git || true
        git fetch origin main
        git fetch upstream main

    - name: Install dependencies
      run: |
        python -m pip install pyyaml

    - name: Generate upstream watch report
      run: |
        python scripts/dev/check_upstream_watchlist.py > maintenance/upstream-watch-report.md || true

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Try upstream merge
      id: merge
      continue-on-error: true
      run: |
        git merge --no-edit upstream/main

    - name: Keep local ignored files after clean merge
      if: steps.merge.outcome == 'success'
      run: |
        git checkout origin/main -- README.md .github/workflows/test.yml
        git add README.md .github/workflows/test.yml

    - name: Auto-resolve ignored conflicts
      if: steps.merge.outcome == 'failure'
      id: ignored_conflicts
      continue-on-error: true
      run: |
        git checkout --ours README.md .github/workflows/test.yml || true
        git add README.md .github/workflows/test.yml || true

        if git diff --name-only --diff-filter=U | grep .; then
          git status --short > maintenance/upstream-merge-conflicts.txt
          git merge --abort
          exit 1
        fi

        git commit --no-edit

    - name: Add conflict report
      if: steps.ignored_conflicts.outcome == 'failure'
      run: |
        git status --short > maintenance/upstream-merge-conflicts.txt || true

    - name: Create sync candidate PR
      if: steps.merge.outcome == 'success' || steps.ignored_conflicts.outcome == 'success'
      uses: peter-evans/create-pull-request@v7
      with:
        branch: chore/upstream-sync-candidate
        delete-branch: true
        title: "Sync upstream main"
        commit-message: "Merge upstream main"
        body-path: maintenance/upstream-watch-report.md
        labels: maintenance, upstream-sync

    - name: Create conflict report PR
      if: steps.ignored_conflicts.outcome == 'failure'
      uses: peter-evans/create-pull-request@v7
      with:
        branch: chore/upstream-sync-conflicts
        delete-branch: true
        title: "Upstream sync has conflicts"
        commit-message: "Report upstream sync conflicts"
        body: |
          Upstream merge failed and requires manual conflict resolution.

          Ignored files are auto-resolved with the local version:
          - `README.md`
          - `.github/workflows/test.yml`

          See `maintenance/upstream-merge-conflicts.txt`.

          Watched-file report: `maintenance/upstream-watch-report.md`.
        labels: maintenance, upstream-sync
