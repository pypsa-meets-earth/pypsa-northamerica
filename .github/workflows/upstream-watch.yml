name: Upstream watch

on:
  schedule:
  - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  upstream-watch:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: main

    - name: Add remotes
      run: |
        git remote add upstream https://github.com/pypsa-meets-earth/pypsa-earth.git || true
        git fetch origin main
        git fetch upstream main

    - name: Install dependencies
      run: |
        python -m pip install pyyaml

    - name: Check watched upstream files
      run: |
        python scripts/dev/check_upstream_watchlist.py
