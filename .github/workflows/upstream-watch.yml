name: Upstream watch

on:
  schedule:
  - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upstream-watch:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: main

    - name: Add remotes
      run: |
        git remote add upstream https://github.com/pypsa-meets-earth/pypsa-earth.git || true
        git fetch origin main
        git fetch upstream main

    - name: Install dependencies
      run: |
        python -m pip install pyyaml

    - name: Prepare temporary reports
      run: |
        mkdir -p .upstream-watch

    - name: Generate upstream watch report
      run: |
        python scripts/dev/check_upstream_watchlist.py > .upstream-watch/upstream-watch-report.md || true

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Try upstream merge
      id: merge
      continue-on-error: true
      run: |
        git merge --no-edit upstream/main

    - name: Write conflict report
      if: steps.merge.outcome == 'failure'
      run: |
        git status --short > .upstream-watch/upstream-merge-conflicts.txt
        git merge --abort

    - name: Upload upstream watch reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: upstream-watch-reports
        path: .upstream-watch/

    - name: Debug merge state
      if: steps.merge.outcome == 'success'
      run: |
        git status --short
        git log --graph --oneline --decorate --max-count=10
        git diff --stat origin/main..HEAD

    - name: Create sync candidate PR
      if: steps.merge.outcome == 'success'
      uses: peter-evans/create-pull-request@v8
      with:
        branch: chore/upstream-sync-candidate
        delete-branch: true
        title: "Sync upstream main"
        commit-message: "Merge upstream main"
        body-path: .upstream-watch/upstream-watch-report.md
        labels: maintenance, upstream-sync

    - name: Fail on upstream merge conflicts
      if: steps.merge.outcome == 'failure'
      run: |
        echo "Upstream merge failed. Download the upstream-watch-reports artifact."
        exit 1
