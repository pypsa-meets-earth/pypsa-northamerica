# =================== META ===================
custom_rules: ["workflow/custom.smk"] # paths to additional .smk files included in the Snakefile


# =================== STUDY SETUP ===================
countries: ["US"] # ISO codes, continent, or custom region

validation:
  planning_horizon: [2020]

foresight: myopic # "myopic" or "overnight"

scenario:
  simpl: [""]
  ll: ["v1"]
  clusters: [100]
  opts: [CCL-3h] # hyphen-joined options: 3h/6h/24h/Nseg temporal | Co2L/Ep/CH4L caps & prices | ATK/ATKc autarky | {carrier}+p/c/m scale | CCL/BAU/SAFE/RES/EQ solve constraints
  planning_horizons: [2030, 2035, 2040] # investment years for myopic; costs year for overnight
  sopts:
  - "3h"

snapshots:
  start: "2023-01-01"
  end: "2024-01-01"
  inclusive: "left" # end is not inclusive

# Weather year shared by snapshots, load profiles, and renewable-resource data.
weather_year: 2023

load_options:
  source: "demcast" # "demcast" or "gegis"
  prediction_year: 2023


# =================== DATA RETRIEVAL ===================
enable:
  # ----------------- Retrieving data -----------------
  retrieve_databundle: false # recommended for first run
  download_osm_data: true # download OpenStreetMap data for the countries specified above
  retrieve_cutout: false # retrieves the bundled 2013 cutout (cutout-2013-era5); changing load_options.weather_year (default: 2013) requires retrieve_cutout:false and build_cutout: true.
  retrieve_cost_data: true # false: use existing data/costs.csv
  retrieve_databundle_sector: true
  download_global_buildings: false # download GlobalMLBuildingFootprints data for the countries specified above
  # ----------------- Building locally -----------------
  build_cutout: false # requires CDS API key (see https://cds.climate.copernicus.eu/how-to-api); uses snapshots and countries
  build_natura_raster: false
  # ----------------- Advanced -----------------
  custom_busmap: false # optional override for cluster_network busmap

# Retrieve precomputed files and bypass their local construction.
retrieve_precomputed:
  cutouts: true # true: retrieve US cutouts; false: build or retrieve them through the standard workflow
  osm_raw: true # true: bypass download_osm_data
  osm_clean: true # true: bypass clean_osm_data
  shapes: true # true: bypass build_shapes
  osm_network: true # true: bypass build_osm_network
  base_network: true # true: bypass base_network
  renewable_profiles: true # true: bypass build_renewable_profiles

custom_databundles:
  bundle_cutouts_USA:
    countries: [US]
    category: cutouts
    destination: "cutouts"
    urls:
      gdrive: https://drive.google.com/file/d/1p5l10dQpszJvIX135NK2n8thqnqKEdUS/view?usp=drive_link
    output: [cutouts/cutout-2013-era5.nc]
    disable_by_opt:
      build_cutout: [all]

  # precomputed raw OSM data
  bundle_osm_raw_USA:
    countries: [US]
    category: resources_osm_raw
    destination: "resources"
    urls:
      zenodo: https://zenodo.org/api/records/21884703/files/osm_raw.zip/content

  # precomputed clean OSM data
  bundle_osm_clean_USA:
    countries: [US]
    category: resources_osm_clean
    destination: "resources"
    urls:
      zenodo: https://zenodo.org/api/records/21884703/files/osm_clean.zip/content

  # precomputed shapes data
  bundle_shapes_USA:
    countries: [US]
    category: resources_shapes
    destination: "resources"
    urls:
      zenodo: https://zenodo.org/api/records/21884703/files/shapes.zip/content

  # precomputed OSM network data
  bundle_osm_network_USA:
    countries: [US]
    category: resources_osm_network
    destination: "resources"
    urls:
      zenodo: https://zenodo.org/api/records/21884703/files/base_network.zip/content

  # precomputed base network
  bundle_base_network_USA:
    countries: [US]
    category: resources_base_network
    destination: "resources"
    urls:
      zenodo: https://zenodo.org/api/records/21884703/files/base.nc.zip/content

  # precomputed renewable profiles
  bundle_renewable_profiles_USA:
    countries: [US]
    category: resources_renewable_profiles
    destination: "resources"
    urls:
      zenodo: https://zenodo.org/api/records/21884703/files/renewable_profiles.zip/content

  # demand data used for demand redistribution
  bundle_demand_data_USA:
    countries: [US]
    category: data_demand_data
    destination: "data/custom/usa"
    urls:
      zenodo: https://zenodo.org/api/records/21884703/files/demand_data.zip/content


# =================== GEOGRAPHY & SHAPES ===================

# ------------------- Clustering -------------------
clustering:
  alternative_clustering: true # false: use Voronoi shapes; true: use GADM shapes
  simplify_network:
    p_threshold_drop_isolated: 0.0
  aggregation_strategies:
    lines:
      tag_type: first
      tag_frequency: first
      underground: any
      under_construction: any


# =================== NETWORK & RESOURCES ===================

# ------------------- Electricity grid -------------------
electricity:
  # ----------------- Electricity generation -----------------
  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, csp, geothermal, nuclear, OCGT, CCGT, biomass]
    Store: [battery, H2]

  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass]
  renewable_carriers: [solar, csp, onwind, offwind-ac, offwind-dc, hydro]

  # ----------------- Existing powerplants -----------------
  custom_powerplants:
    filepaths:
    - data/custom/usa/custom_powerplants_US.csv
    method: replace

  estimate_renewable_capacities:
    stats: false # false: greenfield expansion; "irena": use IRENA statistics to add expansion limits

  # ----------------- Grid topology -----------------
  voltages: [69., 100., 115., 138., 161., 230., 345., 500., 765.]

  # ----------------- Constraints & reserve -----------------
  agg_p_nom_limits:
    file: data/custom/usa/agg_p_nom_minmax.csv

lines:
  use_country_specific_types: true

# ------------------- Weather & renewables -------------------
renewable:
  hydro:
    normalization:
      method: eia
    hydro_capital_cost: true

# ------------------- Costs & emissions -------------------
costs:
  year: 2030 # cost file selection; reference year for costs is always 2025
  technology_data_version: v0.15.0
  output_currency: "USD"
  discountrate: [0.07] # from the `fill_values` section
  country_specific_data: "US" # optional; country-specific data are currently available only for "US"
  cost_scenario: "moderate" # "moderate", "advanced", or "conservative"
  cost_scenario_by_technology_group: # optional overrides for specific technology groups
    electricity: "moderate"
    H2_electrolysis: "moderate"
    dac: "moderate"
  financial_case: "market" # "market" or "r&d"
  discount rate:
    direct air capture: 0.10
    Fischer-Tropsch: 0.10
    Alkaline electrolyzer large size: 0.10
    Alkaline electrolyzer medium size: 0.10
    Alkaline electrolyzer small size: 0.10
    PEM electrolyzer small size: 0.10
    SOEC: 0.10
  lifetime:
    CCGT: 45
    OCGT: 45

# ------------------- Electricity policies -------------------

state_policy: "off" # "off" or "on": apply renewable and clean-energy policies at state or country level

# =================== SECTOR OPTIONS ===================

# ------------------- Hydrogen policy & export -------------------
policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching" # "hourly", "monthly", "yearly", or "no_temporal_matching"
    additionality: true
    temporal_matching_carriers: [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro, nuclear]
    h2_production_constraint: false

export:
  endogenous: false # true: export demand is determined endogenously
  h2export: 0 # yearly export demand in TWh; used only when export.endogenous is false

# ------------------- Sector-coupled demand data -------------------
demand_data:
  base_year: 2021

demand_projection:
  planning_horizon: 2023
  scenario: "Medium"
  data_centers_load: true

demand_distribution:
  enable: true
  base_demand_year: 2023
  holes_area_threshold: 100
  nprocesses: 4
  plotting: true
  set_distribution_fees: true

# ------------------- Custom data -------------------
custom_data:
  airports: true

# ------------------- Brownfield capacities -------------------
existing_capacities:
  grouping_years_power: [1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2023, 2025, 2030]
  threshold_capacity: 5 # MW; capacities below this threshold are not added in a separate horizon

# ------------------- Shipping & aviation -------------------
aviation_demand_scenario:
  country: US
  scenario: central # low, central, or high

saf_mandate:
  ekerosene_split: true # model e-kerosene on a separate bus
  non_spatial_ekerosene: true # connect all e-kerosene buses to a single zero-cost transport and storage bus
  enable_mandate: false
  saf_scenario: EU

# ------------------- Enabled sectors & fuel infrastructure -------------------
sector:
  co2_sequestration_potential: 250 # MtCO2/a sequestration potential for the US
  co2_sequestration_cost: 8 # USD/tCO2
  demand_projection_reference_year: 2023
  ammonia:
    enable: false

  oil:
    spatial_oil: true

  # ------------------- Electricity distribution grid -------------------
  solar_rooftop: # adds customer-side rooftop PV; requires electricity_distribution_grid: true
    m2_per_person: 12

# ------------------- Custom industry -------------------
custom_industry:
  enable: true
  ethanol: true
  ammonia: true
  steel: true
  cement: true
  CCS_retrofit: [ethanol, ammonia, steel, cement]
  production_flexibility: []
  H2_DRI: false
  biogenic_co2: false # expose ethanol fermentation CO2 as biogenic CO2 for Fischer-Tropsch
  grid_H2: true # mark electrolysis output as grid H2 for use in Fischer-Tropsch
  other_electricity: true
  dac_inputs:
    heat: false
    electricity: 1.4 # MWh per tCO2
  buffer_co2_stored: true
  co2_storage_tanks: true


# =================== SOLVING ===================
solving:
  # ------------------- Solver -------------------
  solver:
    name: gurobi
    options: gurobi-default

  # ------------------- Optimization options -------------------
  options:
    load_shedding: 100

  # ------------------- Solver presets -------------------
  solver_options:
    gurobi-default:
      threads: 8
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-4
      BarHomogeneous: 1
