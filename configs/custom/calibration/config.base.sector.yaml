# =================== STUDY SETUP ===================
countries: ["US"] # ISO codes, continent, or custom region

foresight: overnight # "myopic" or "overnight"

run:
  sector_name: "US_2023" # use this to keep track of sector scenario runs

scenario:
  simpl: [""]
  ll: ["v1"]
  clusters: [100]
  opts: [Co2L-3h] # hyphen-joined options: 3h/6h/24h/Nseg temporal | Co2L/Ep/CH4L caps & prices | ATK/ATKc autarky | {carrier}+p/c/m scale | CCL/BAU/SAFE/RES/EQ solve constraints — see doc/user-guide/wildcards.md
  planning_horizons: # investment years for myopic; costs year for overnight
  - 2020
  sopts:
  - "3h"


# =================== NETWORK & RESOURCES ===================

# ------------------- Electricity grid -------------------
electricity:
  # ----------------- Electricity generation -------------------
  extendable_carriers:
    Generator: [] # Remove 'offwind-ac' and 'offwind-dc' for landlocked countries (e.g. Jordan, Austria, Switzerland)
    Store: [] # battery, H2

# ------------------- Weather & renewables -------------------
renewable:
  hydro:
    normalization:
      method: eia
    hydro_capital_cost: true


# ------------------- Costs & emissions -------------------
costs:
  year: 2020 # cost file selection, i.e. costs_2020.csv in this case; reference year for costs is always 2025

  lifetime: # years
    CCGT: 45
    OCGT: 45

  efficiency: # per unit
    coal: 0.3195 # EIA https://www.eia.gov/electricity/annual/html/epa_08_01.html
    oil: 0.3005 # EIA https://www.eia.gov/electricity/annual/html/epa_08_01.html
    CCGT: 0.4429 # EIA https://www.eia.gov/electricity/annual/html/epa_08_01.html
    nuclear: 0.3254 # EIA https://www.eia.gov/electricity/annual/html/epa_08_01.html
    biomass: 0.3000 # EIA https://www.eia.gov/electricity/annual/html/epa_08_01.html

  VOM: # currency/MWh
    oil: 100.0

co2:
  limit: 4.633e+9 # base * 1.1 for calibration purposes
  base: 4.413e+9 # power sector emissions US 2023 https://www.iea.org/countries/united-states/emissions
  emission_price: 0. # [currency/tCO2]; active via Ep wildcard


# =================== SECTOR OPTIONS ===================

policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching" # either "hourly", "monthly", "yearly", "no_temporal_matching"
    temporal_matching_carriers: [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro, nuclear]

demand_data:
  base_year: 2021

custom_data:
  airports: true # If "True" then a custom .csv file must be placed in "data/custom/airports.csv". Data format for airports must follow the airports.csv file in the data folder.

sector:
  # ------------------- ELECTRICITY DISTRIBUTION GRID -------------------
  electricity_distribution_grid: true # adds low voltage buses and shifts AC loads, BEVs, heat pumps, resistive heaters, and micro CHPs to low voltage buses if technologies are present

  # ------------------- POWERPLANTS OPTIONS -------------------
  conventional_generation: # generator : carrier
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass

  # ------------------- HYDROGEN OPTIONS -------------------
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"] # list of H2 production technologies that can be added

  # ------------------- CARBON CAPTURE OPTIONS -------------------
  cc: false # Default CC technologies from PyPSA-Earth (not influencing ethanol, ammonia, cement and still carbon capture retrofits)
  SMR CC: false

  # ------------------- LAND TRANSPORT SECTOR -------------------
  land_transport_fuel_cell_share: # 1 means all FCEVs
    AB_2023: 0
  land_transport_electric_share: # 1 means all EVs
    AB_2023: 0.006

  # ------------------- SHIPPING & AVIATION SECTOR -------------------
  shipping_hydrogen_share: # 1 means all hydrogen-powered shipping
    AB_2023: 0
