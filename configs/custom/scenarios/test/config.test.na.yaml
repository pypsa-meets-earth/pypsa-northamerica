# =================== STUDY SETUP ===================
countries: ["US"] # ISO codes, continent, or custom region

test_geography:
  enable: true
  boundary: data/custom/usa/test_geometries/us_small.geojson

run:
  name: "US_small_test"
  sector_name: "US_small_test"

foresight: myopic # "myopic" or "overnight"

scenario:
  simpl: [""]
  ll: ["v1"]
  clusters: [10]
  opts: [CCL-168H] # hyphen-joined options: 3h/6h/24h/Nseg temporal | Co2L/Ep/CH4L caps & prices | ATK/ATKc autarky | {carrier}+p/c/m scale | CCL/BAU/SAFE/RES/EQ solve constraints — see doc/user-guide/wildcards.md
  planning_horizons: [2030] # investment years for myopic; costs year for overnight
  sopts: ["168H"]


# =================== DATA RETRIEVAL ===================
enable:
  # ----------------- Retrieving data -----------------
  retrieve_databundle: true # recommended for first run
  use_test_basins_na: true
  download_osm_data: true # download OpenStreetMap data for the countries specified above
  retrieve_cost_data: true # false: use existing data/costs.csv
  retrieve_databundle_sector: true
  retrieve_cutout: false
  build_cutout: false
  # ----------------- Advanced -----------------
  custom_busmap: false # optional override for cluster_network busmap

# Exclude the global HydroBASINS bundle because CI provides the NA test file.
databundles:
  bundle_hydrobasins:
    disable_by_opt:
      use_test_basins_na: [all]

# Retrieve precomputed files and bypass their local construction.
retrieve_precomputed:
  cutouts: true
  osm_raw: true  # true: bypass download_osm_data
  osm_clean: false  # true: bypass clean_osm_data
  shapes: false  # true: bypass build_shapes
  osm_network: false  # true: bypass build_osm_network
  base_network: false  # true: bypass base_network
  renewable_profiles: false  # true: bypass build_renewable_profiles

custom_databundles:
  bundle_cutouts_USA:
    countries: [US]
    category: cutouts
    destination: "cutouts"
    urls:
      gdrive: https://drive.google.com/file/d/1CUkXPsU024-kLLI3rp7BzFGeHxAxIWRP/view?usp=drive_link
    output: [cutouts/cutout-2013-era5.nc]
    disable_by_opt:
      build_cutout: [all]

# =================== GEOGRAPHY & SHAPES ===================

# ------------------- Clustering -------------------
clustering:
  alternative_clustering: false # false: use Voronoi shapes; true: use GADM shapes (only Voronoi clustering is currently supported)
  simplify_network:
    p_threshold_drop_isolated: 0.0
  aggregation_strategies:
    lines:
      tag_type: first
      tag_frequency: first
      underground: any
      under_construction: any


# =================== NETWORK & RESOURCES ===================

# ------------------- Electricity grid -------------------
electricity:
  # ----------------- Electricity generation -------------------
  extendable_carriers:
    Generator: [solar, onwind, geothermal, nuclear, OCGT, CCGT, biomass]
    Store: [battery, H2]

  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass]
  renewable_carriers: [solar, onwind, hydro]

  # ----------------- Existing powerplants -------------------
  custom_powerplants:
    filepaths:
    - data/custom/usa/custom_powerplants_test_US_small.csv
    method: replace

  estimate_renewable_capacities:
    stats: false # false: greenfield expansion; "irena": use IRENA statistics to add expansion limits

  # ----------------- Grid topology -------------------
  voltages: [69., 100., 115., 138., 161., 230., 345., 500., 765.]

  # ----------------- Constraints & reserve -------------------
  agg_p_nom_limits:
    file: data/custom/usa/agg_p_nom_minmax.csv

lines:
  use_country_specific_types: true
  ac_types:
    US:
      69.: "US_69kV"
      100.: "US_100kV"
      115.: "US_115kV"
      138.: "US_138kV"
      161.: "US_161kV"
      230.: "US_230kV"
      345.: "US_345kV"
      500.: "US_500kV"
      765.: "US_765kV"

# ------------------- Weather & renewables -------------------
renewable:
  hydro:
    hydrobasins_level: 6
    resource:
      hydrobasins: data/custom/hydrobasins_na/hybas_na_lev06_v1c.shp
    normalization:
      method: eia
    hydro_capital_cost: false

# ------------------- Costs & emissions -------------------
costs:
  year: 2030 # cost file selection; reference year for costs is always 2025
  cost_scenario: "moderate" # used only with country_specific_data: "US"; "moderate", "advanced", or "conservative"
  cost_scenario_by_technology_group: # optional overrides for specific technology groups
    electricity: "moderate"
    H2_electrolysis: "moderate"
    dac: "moderate"
  VOM:
    oil: 100.0


# =================== SECTOR OPTIONS ===================

# ------------------- Hydrogen policy & export -------------------
policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching" # "hourly", "monthly", "yearly", or "no_temporal_matching"
    additionality: false
    temporal_matching_carriers: [solar, onwind, ror, hydro, nuclear]
    h2_production_constraint: false

# ------------------- Sector-coupled demand data -------------------
demand_data:
  base_year: 2021

demand_projection:
  planning_horizon: 2030
  scenario: "Medium"
  data_centers_load: false

demand_distribution:
  enable: true
  base_demand_year: 2023
  holes_area_threshold: 100
  nprocesses: 2
  plotting: false
  set_distribution_fees: false

# ------------------- Custom data -------------------
custom_data:
  airports: false

# ------------------- Brownfield capacities -------------------
existing_capacities:
  threshold_capacity: 5 # MW; capacities below this threshold are not added in a separate horizon

# ------------------- State and country policies -------------------
policies:
  state: ["CES", "RES"] # apply state-level clean-energy and renewable-energy constraints
  country: [] # apply country-level clean-energy constraints

# ------------------- Shipping & aviation -------------------
aviation_demand_scenario:
  country: US
  scenario: central # low, central, or high

saf_mandate:
  ekerosene_split: false # model e-kerosene on a separate bus
  non_spatial_ekerosene: true # connect all e-kerosene buses to a single zero-cost transport and storage bus
  enable_mandate: false
  saf_scenario: EU # EU, EU+, or EU-

# ------------------- Enabled sectors & fuel infrastructure -------------------
sector:
  electricity_distribution_grid: false
  solar_thermal_collector:
    enable: false
    cf_correction: 0.788457
    clearsky_model: simple
    orientation:
      slope: 45.
      azimuth: 180.
  solar_rooftop:
    enable: false

  conventional_generation:
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"]

  cc: false
  SMR CC: false

  land_transport_fuel_cell_share:
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
  land_transport_electric_share:
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
  shipping_hydrogen_share:
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0

# ------------------- Custom industry -------------------
custom_industry:
  enable: false


# =================== SOLVING ===================
solving:
  # ------------------- Solver -------------------
  solver:
    name: highs
    options: highs-ci

  # ------------------- Optimization options -------------------
  options:
    load_shedding: false

  # ------------------- Solver presets -------------------
  solver_options:
    highs-ci:
      # See https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 4
      solver: "simplex"
      parallel: "on"
      random_seed: 123
