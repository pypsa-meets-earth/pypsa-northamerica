countries: ["US"]

test_region:
  region_column: egrid_reg
  region: TRE

enable:
  retrieve_databundle: true
  retrieve_databundle_sector: true
  retrieve_cost_data: true
  download_osm_data: true
  retrieve_cutout: false
  build_cutout: false
  custom_busmap: false

retrieve_precomputed:
  cutouts: true
  osm_raw: true
  osm_clean: true
  osm_network: true
  base_network: true
  renewable_profiles: true

run:
  name: "NA_test"
  sector_name: "NA_test"

foresight: myopic

scenario:
  simpl: ['']
  ll: ['v1']
  clusters: [10]
  opts: [CCL-24H]
  planning_horizons:
  - 2040
  sopts:
  - "24H"

aviation_demand_scenario:
  country: US
  scenario: central # low, central or high

saf_mandate:
  ekerosene_split: false # separate e-kerosene as separate bus
  non_spatial_ekerosene: true # connects all e-kerosene buses with a single E-kerosene-main bus to model 0 cost of transport and store
  enable_mandate: false # enable SAF mandate
  saf_scenario: EU # EU (default), EU+, EU-

# Keep this off until ERCOT demand mapping is verified.
demand_distribution:
  enable: false
  base_demand_year: 2023
  holes_area_threshold: 100
  nprocesses: 2
  plotting: false
  set_distribution_fees: false

demand_projection:
  planning_horizon: 2030 # only needed for power model, sector model takes demand from UN data using planning_horizon
  scenario: "Medium"
  data_centers_load: false

policies:
  state: ["CES", "RES"] # "CES" to adopt State-wise clean electricity generation constraints from currently stated policies, "RES" to adopt State-wise renewable electricity generation constraints from currently stated policies, both to apply both kinds of constraints
  country: [] # "CES" to adopt country-wise clean electricity generation constraint (90% clean electricity by 2040), otherwise empty

custom_industry:
  CCS_retrofit: [ethanol, ammonia, steel, cement]

cluster_options:
  alternative_clustering: false  # "False" use Voronoi shapes, "True" use GADM shapes (only Voronoi clustering is currently supported)
  simplify_network:
    p_threshold_drop_isolated: 0.0
  aggregation_strategies:
    lines:
      tag_type: first
      tag_frequency: first
      underground: any
      under_construction: any

electricity:
  agg_p_nom_limits:
    file: data/custom/usa/agg_p_nom_minmax.csv
  extendable_carriers:
    Generator: [solar, onwind, geothermal, nuclear, OCGT, CCGT, biomass]
    Store: [battery, H2]

  custom_powerplants: "replace" #  "false" use only powerplantmatching (ppm) data, "merge" combines ppm and custom powerplants, "replace" use only custom powerplants
  custom_powerplants_file: data/custom/usa/custom_powerplants_test_TRE.csv

  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass]
  renewable_carriers: [solar, onwind, hydro]

  estimate_renewable_capacities:
    stats: false  # False, = greenfield expansion, 'irena' uses IRENA stats to add expansion limits

renewable:
  hydro:
    normalization:
      method: eia
    hydro_capital_cost: true

costs:
  year: 2030
  cost_scenario: "moderate" # only used if `country_specific_data: "US"`; can be "moderate", "advanced" or "conservative"
  cost_scenario_by_technology_group: # (optional): overwrites for some specific technology groups
    electricity: "moderate"
    H2_electrolysis: "moderate"
    dac: "moderate"
  VOM:
    oil: 100.0

policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching"
    additionality: false
    temporal_matching_carriers: [solar, onwind, ror, hydro, nuclear]
    h2_production_constraint: false

demand_data:
  base_year: 2021

custom_data:
  airports: false

existing_capacities:
  threshold_capacity: 5

sector:
  electricity_distribution_grid: false
  solar_thermal: false
  solar_rooftop:
    enable: false

  conventional_generation:
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"]

  cc: false
  SMR CC: false

  land_transport_fuel_cell_share:
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
  land_transport_electric_share:
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
  shipping_hydrogen_share:
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0

solving:
  options:
    load_shedding: true
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    gurobi-default:
      threads: 2
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-4
      BarHomogeneous: 1

plotting:
  tech_colors:
    PHS: "#036356"
    wind: "#6895dd"
