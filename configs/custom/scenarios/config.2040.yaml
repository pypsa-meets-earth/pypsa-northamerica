run:
  name: "US_2040" # use this to keep track of runs with different settings
  sector_name: "US_2040"

scenario:
  ll: ['copt']

demand_projection:
  planning_horizon: 2040 # only needed for power model, sector model takes demand from UN data using planning_horizon
  scenario: "Medium"
  data_centers_load: true

policies:
  state: ["CES", "RES"] # "CES" to adopt State-wise clean electricity generation constraints from currently stated policies, "RES" to adopt State-wise renewable electricity generation constraints from currently stated policies, both to apply both kinds of constraints
  country: [] # "CES" to adopt country-wise clean electricity generation constraint (90% clean electricity by 2040), otherwise empty

custom_industry:
  CCS_retrofit: [ethanol, ammonia, steel, cement]

electricity:
  powerplants_filter: DateOut >= 2040 and DateIn < 2040

costs:
  year: 2040
  VOM:
    oil: 100.0

policy_config:
  hydrogen:
    temporal_matching: "hourly" # either "hourly", "monthly", "yearly", "no_temporal_matching"
    additionality: true
    temporal_matching_carriers: [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro, nuclear]

sector:
  electricity_distribution_grid: true
  conventional_generation: # generator : carrier
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"]

  cc: false # Default CC technologies from PyPSA-Earth (not influencing ethanol, ammonia, cement and still carbon capture retrofits
  SMR CC: false

  land_transport_fuel_cell_share:
    AB_2040: 0.0
  land_transport_electric_share:
    AB_2040: 0.353 # 0.064 (Reference) 0.353 (Medium) 0.462 (High)
  shipping_hydrogen_share:
    AB_2040: 0.00
