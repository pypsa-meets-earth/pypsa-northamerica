#
# Scenario n. 5 - Sensitivity - Sensitivity - High climate ambition & No e-kerosene mandate
#
# | Temporal matching        | Hourly matching                           | Yes                                                              |
# | Aviation sector          | Aviation demand                           | Central                                                          |
# |                          | e-kerosene blending mandate               | No e-kerosene mandate                                            |
# | Demand projections       | Electricity demand + EV share             | High                                                             |
# | Costs                    | Electricity generation (NREL ATB)         | Moderate + tax credits                                           |
# |                          | Electrolysis (ICCT IRA assumptions)       | Moderate + tax credits                                           |
# |                          | DAC                                       | Moderate + tax credits                                           |
# |                          | Point-source CO₂ capture (NPC)            | Conservative + tax credits                                       |
# | Supply constraint        | CO2 supply                                | Biogenic sources + DAC                                           |
# | Power sector development | Transmission expansion                    | Optimal transmission expansion                                   |
# |                          | State policies for electricity generation | Current policies + 90% clean electricity by 2040 (country level) |

run:
  name: "US_scenario_05" # use this to keep track of runs with different settings
  sector_name: "US_scenario_05"

scenario:
  ll: ['copt']

demand_projection:
  planning_horizon: 2030 # only needed for power model, sector model takes demand from UN data using planning_horizon
  scenario: "High"
  data_centers_load: true

policies:
  state: ["CES", "RES"] # "CES" to adopt State-wise clean electricity generation constraints from currently stated policies, "RES" to adopt State-wise renewable electricity generation constraints from currently stated policies, both to apply both kinds of constraints
  country: ["CES"] # "CES" to adopt country-wise clean electricity generation constraint (90% clean electricity by 2040), otherwise empty
  pre_ob3_tax_credits: true

line_expansion_limits: # from DOE NTL Study
  2030: v1.087
  2035: v1.153
  2040: v1.227

custom_industry:
  biogenic_co2: true

costs:
  year: 2030
  cost_scenario: "moderate" # only used if `country_specific_data: "US"`; can be "moderate", "advanced" or "conservative"
  cost_scenario_by_technology_group: # (optional): overwrites for some specific technology groups
    electricity: "moderate"
    H2_electrolysis: "moderate"
    dac: "moderate"
  VOM:
    oil: 100.0


policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching" # either "hourly", "monthly", "yearly", "no_temporal_matching"
    additionality: false
    temporal_matching_carriers: [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro, nuclear]
    h2_production_constraint: true
    h2_production_limits: data/h2_prod_minmax.csv

sector:
  electricity_distribution_grid: true
  conventional_generation: # generator : carrier
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"]

  cc: false # Default CC technologies from PyPSA-Earth (not influencing ethanol, ammonia, cement and still carbon capture retrofits
  SMR CC: false

  land_transport_fuel_cell_share:
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
  land_transport_electric_share:
    AB_2030: 0.148
    AB_2035: 0.268
    AB_2040: 0.397
  shipping_hydrogen_share:
    AB_2030: 0.00
    AB_2035: 0.00
    AB_2040: 0.00
