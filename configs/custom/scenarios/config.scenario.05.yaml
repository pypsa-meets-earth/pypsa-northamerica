#
# Scenario n. 5 - Sensitivity - High climate ambition & No e-kerosene mandate
#
# | Temporal matching        | Hourly matching                           | Yes                                                              |
# | Aviation sector          | Aviation demand                           | Central                                                          |
# |                          | e-kerosene blending mandate               | No e-kerosene mandate                                            |
# | Demand projections       | Electricity demand + EV share             | High                                                             |
# | Costs                    | Electricity generation (NREL ATB)         | Moderate + tax credits                                           |
# |                          | Electrolysis (ICCT IRA assumptions)       | Moderate + tax credits                                           |
# |                          | DAC                                       | Moderate + tax credits                                           |
# |                          | Point-source CO₂ capture (NPC)            | Conservative + tax credits                                       |
# | Supply constraint        | CO2 supply                                | Biogenic sources + DAC                                           |
# | Power sector development | Transmission expansion                    | Optimal transmission expansion                                   |
# |                          | State policies for electricity generation | Current policies + 90% clean electricity by 2040 (country level) |


# =================== STUDY SETUP ===================

run:
  name: "US_scenario_05" # use this to keep track of runs with different settings
  sector_name: "US_scenario_05" # use this to keep track of sector scenario runs

scenario:
  ll: ["copt"]

# =================== NETWORK & RESOURCES ===================

# ------------------- Demand projection -------------------
demand_projection:
  planning_horizon: 2030 # only needed for the power model; the sector model takes demand from UN data using planning_horizon
  scenario: "High"
  data_centers_load: true

# ------------------- Electricity policies -------------------

state_policy: "off" # "off" or "on": apply renewable and clean-energy policies at state or country level

policies:
  state: ["CES", "RES"] # "CES" applies state clean-electricity constraints; "RES" applies state renewable-electricity constraints; use both to apply both kinds
  country: ["CES"] # "CES" applies the country clean-electricity constraint (90% clean electricity by 2040); otherwise leave empty
  pre_ob3_tax_credits: true

# ------------------- Transmission expansion -------------------
line_expansion_limits: # from DOE NTL Study
  2030: v1.087
  2035: v1.153
  2040: v1.227

costs:
  year: 2030 # cost file selection, i.e. costs_2030.csv in this case; reference year for costs is always 2025
  cost_scenario: "moderate" # only used if `country_specific_data: "US"`; can be "moderate", "advanced", or "conservative"
  cost_scenario_by_technology_group: # optional overrides for specific technology groups
    electricity: "moderate"
    H2_electrolysis: "moderate"
    dac: "moderate"


# =================== SECTOR OPTIONS ===================

# ------------------- Hydrogen policy -------------------
policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching" # either "hour", "month", "year", or "no_temporal_matching"
    additionality: false # RE electricity is equal to the amount required for additional hydrogen export compared to the zero-export reference case
    temporal_matching_carriers: [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro, nuclear]
    h2_production_constraint: true
    h2_production_limits: data/h2_prod_minmax.csv

# ------------------- Custom industry -------------------
custom_industry:
  biogenic_co2: true

sector:
  # ------------------- ELECTRICITY DISTRIBUTION GRID -------------------
  electricity_distribution_grid: true # adds low-voltage buses and shifts AC loads, BEVs, heat pumps, resistive heaters, and micro CHPs to low-voltage buses if technologies are present

  # ------------------- POWERPLANTS OPTIONS -------------------
  conventional_generation: # generator : carrier
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass

  # ------------------- HYDROGEN OPTIONS -------------------
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"] # list of H2 production technologies that can be added

  # ------------------- CARBON CAPTURE OPTIONS -------------------
  cc: false # Default CC technologies from PyPSA-Earth (not influencing ethanol, ammonia, cement, and steel carbon-capture retrofits)
  SMR CC: false

  # ------------------- LAND TRANSPORT SECTOR -------------------
  land_transport_fuel_cell_share: # 1 means all FCEVs
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
  land_transport_electric_share: # 1 means all EVs
    AB_2030: 0.148
    AB_2035: 0.268
    AB_2040: 0.397

  # ------------------- SHIPPING & AVIATION SECTOR -------------------
  shipping_hydrogen_share: # 1 means all hydrogen-powered shipping
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
