# =================== STUDY SETUP ===================

run:
  name: "US_myopic" # use this to keep track of runs with different settings
  sector_name: "US_myopic" # use this to keep track of sector scenario runs

scenario:
  simpl: [""]
  ll: ["copt"]
  clusters: [100]
  opts: [CCL-3h] # hyphen-joined options: 3h/6h/24h/Nseg temporal | Co2L/Ep/CH4L caps & prices | ATK/ATKc autarky | {carrier}+p/c/m scale | CCL/BAU/SAFE/RES/EQ solve constraints
  planning_horizons: [2030, 2035, 2040] # investment years for myopic; costs year for overnight
  sopts:
  - "3h"


# =================== NETWORK & RESOURCES ===================

# ------------------- Demand projection -------------------
demand_projection:
  planning_horizon: 2030 # only needed for the power model; the sector model takes demand from UN data using planning_horizon
  scenario: "Medium"
  data_centers_load: true

# ------------------- Electricity policies -------------------

state_policy: "off" # "off" or "on": apply renewable and clean-energy policies at state or country level

policies:
  state: ["CES", "RES"] # "CES" applies state clean-electricity constraints; "RES" applies state renewable-electricity constraints; use both to apply both kinds
  country: [] # "CES" applies the country clean-electricity constraint (90% clean electricity by 2040); otherwise leave empty

# ------------------- Costs & emissions -------------------
costs:
  year: 2030 # cost file selection, i.e. costs_2030.csv in this case; reference year for costs is always 2025


# =================== SECTOR OPTIONS ===================

# ------------------- Hydrogen policy -------------------
policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching" # either "hour", "month", "year", or "no_temporal_matching"
    additionality: true # RE electricity is equal to the amount required for additional hydrogen export compared to the zero-export reference case
    temporal_matching_carriers: [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro, nuclear]

# ------------------- Custom industry -------------------
custom_industry:
  CCS_retrofit: [ethanol, ammonia, steel, cement] # sectors for which CCS retrofits are enabled

sector:
  # ------------------- ELECTRICITY DISTRIBUTION GRID -------------------
  electricity_distribution_grid: true # adds low-voltage buses and shifts AC loads, BEVs, heat pumps, resistive heaters, and micro CHPs to low-voltage buses if technologies are present

  # ------------------- POWERPLANTS OPTIONS -------------------
  conventional_generation: # generator : carrier
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass

  # ------------------- HYDROGEN OPTIONS -------------------
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"] # list of H2 production technologies that can be added

  # ------------------- CARBON CAPTURE OPTIONS -------------------
  cc: false # Default CC technologies from PyPSA-Earth (not influencing ethanol, ammonia, cement, and steel carbon-capture retrofits)
  SMR CC: false

  # ------------------- LAND TRANSPORT SECTOR -------------------
  land_transport_fuel_cell_share: # 1 means all FCEVs
    AB_2030: 0.0
    AB_2035: 0.0
    AB_2040: 0.0
  land_transport_electric_share: # 1 means all EVs
    AB_2030: 0.165 # 0.041 (Reference) 0.165 (Medium) 0.191 (High)
    AB_2035: 0.275 # 0.053 (Reference) 0.275 (Medium) 0.332 (High)
    AB_2040: 0.353 # 0.064 (Reference) 0.353 (Medium) 0.462 (High)

  # ------------------- SHIPPING & AVIATION SECTOR -------------------
  shipping_hydrogen_share: # 1 means all hydrogen-powered shipping
    AB_2030: 0.00
    AB_2035: 0.00
    AB_2040: 0.00
